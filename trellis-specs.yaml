    - id: US-5
      kind: story
      title: Story state machine with gates
      body: As the process owner I want story status to move only through guarded transitions (todo -> refined -> in_progress -> done) so that an agent can never skip refinement, start on an incomplete spec, or declare done without evidence.
      status: done
      acceptance_criteria:
        - id: US-5.AC-1
          given: a story in any state
          when: the agent attempts a transition whose guards fail
          then: the transition is rejected listing every blocking problem in one response
        - id: US-5.AC-2
          given: a story with an incomplete or partially approved tree
          when: the agent runs refine
          then: refine is blocked until every AC is covered, exactly one arch spec with integration tests and detail designs exists, every detail design has unit test specs, and every node is approved and fresh
        - id: US-5.AC-3
          given: a story
          when: the agent tries to set a status directly
          then: no such operation exists on the tool surface; only refine/start/finish move status
        - id: US-5.AC-4
          given: a done story
          when: the human prunes it
          then: the whole tree is deleted unless an outside node depends on a tree member
      approved_content_hash: 1a3e86e43371fa631b3059312af9e445b58f592fe888a857314af990c1fed7dc
      children:
        - id: AS-5
          kind: arch
          title: Verb-only state machine
          body: Transitions are verbs with guards, executed by the engine; statuses are never writable data. integrity() computes the full blocking list (structure + coverage + freshness) and is re-checked by every verb. Edits downgrade eagerly so list_stories never lies.
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
            - target: CC-4
              pinned_hash: e01e58b15446c1374ab40efa97c8e1a3fba3a4cb276bac96d2c7ecd6268e0c08
          approved_content_hash: c6e7ab1cf264ea754864a4762e65901e636000fb0e7862b24d45ab3a881e7fca
          approved_parent_hash: 1a3e86e43371fa631b3059312af9e445b58f592fe888a857314af990c1fed7dc
          children:
            - id: DD-5
              kind: detail_design
              title: Integrity computation
              body: core.integrity aggregates structural rules, AC coverage and per-node freshness into one problem list; Transition dispatches refine/start/finish with requireStatus + requireIntegrity.
              approved_content_hash: 76e0aea50eb6a56f11eede926d00534f4a8e1c0bee8dd166b95c511634cfa58b
              approved_parent_hash: c6e7ab1cf264ea754864a4762e65901e636000fb0e7862b24d45ab3a881e7fca
              children:
                - id: UT-5
                  kind: unit_test
                  title: Guard matrix unit tests
                  body: Unit-test each structural defect producing exactly its problem line and refine flipping status only on an empty problem list.
                  approved_content_hash: 8e17cc4f395588fb60f836418fae452b0e77e87c78ed41cddcfe7387bd9a52d3
                  approved_parent_hash: 76e0aea50eb6a56f11eede926d00534f4a8e1c0bee8dd166b95c511634cfa58b
            - id: IT-5
              kind: integration_test
              title: Transition guard integration
              body: 'Engine + store: every illegal (state, verb) pair, refine on trees with each single defect, and the downgrade-then-repair-then-refine loop.'
