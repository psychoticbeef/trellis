          given: a done story
          when: set_map_position is called
          then: the story stays done, its content hash is unchanged and no integrity marker changes.
        - id: US-44.AC-2
          given: a story is placed
          when: get_tree runs
          then: activity, rank and slice appear on the story node.
        - id: US-44.AC-3
          given: the map is incomplete
          when: create_node kind=story is called without placement
          then: the story is created as unmapped story.
        - id: US-44.AC-4
          given: activities and placements exist
          when: export then import run
          then: activities, positions and placements round-trip identically.
        - id: US-44.AC-5
