trellis_export: 1
project:
    name: trellis
    description: 'Deterministic spec tracking and story gating for LLM-driven development: hash-approved spec trees, gated gitflow in worktrees, test evidence as the definition of done.'
    base_branch: develop
    release_branch: main
    lint_cmd: gofmt -l . | tee /dev/stderr | wc -l | grep -q "^ *0$" && go vet ./...
    test_cmd: mkdir -p reports && go run gotest.tools/gotestsum@latest --junitfile reports/tests.xml -- -coverprofile=reports/cover.out ./...
    junit_glob: reports/*.xml
glossary:
    - term: acceptance criterion
      definition: Structured given/when/then requirement on a story; every one must be covered by an acceptance test spec.
    - term: approval
      definition: Hash-proof that a reviewer read a node's current content; parents before children, dependencies re-pinned.
    - term: base branch
      definition: The branch that only receives trellis merges (default develop); direct commits are gate-blocked.
    - term: cross-cutting spec
      definition: Root-level architecture decision, referenced from arch specs via hash-pinned dependency links.
    - term: evidence
      definition: The proving tests recorded per test spec at finish; latest run replaces older records.
    - term: gate
      definition: 'A guard that must pass before a transition proceeds: structure, freshness, lint, tests, evidence, up-to-date branch.'
    - term: living context
      definition: Done specs stay editable so context tracks reality; honesty comes from stale markers, not locks.
    - term: prune
      definition: Hard delete of a done story's tree when its feature leaves the product; the only way spec content disappears.
    - term: sequencing link
      definition: 'Unpinned story-to-story dependency: start waits until the prerequisite story is done.'
    - term: spec tree
      definition: 'One story''s hierarchy: acceptance tests, exactly one arch spec, integration tests, detail designs, unit test specs.'
    - term: stale
      definition: An approval invalidated by a content, parent or dependency change; cleared only by re-approval.
    - term: story
      definition: 'Unit of work: a spec tree plus the gated lifecycle todo -> refined -> in_progress -> done.'
    - term: story worktree
      definition: Per-story git worktree under .trellis-worktrees/ where all implementation work happens.
