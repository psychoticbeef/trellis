    - id: US-32
      kind: story
      title: Coverage visibility
      body: 'As a team I want test gaps visible without being gated on them: finish records code coverage when configured, the overview and the board show the overall percentage and the least-covered files, and closing a gap stays a judgment call, never a blocker.'
      status: done
      acceptance_criteria:
        - id: US-32.AC-1
          given: a project with coverage_glob configured
          when: finish passes its gates
          then: the coverage files are parsed (LCOV and Go coverprofile, auto-detected per file), the per-file snapshot replaces the previous one, and the finish message carries the overall percentage plus the largest gaps
        - id: US-32.AC-2
          given: missing, empty or unparsable coverage files
          when: finish runs
          then: 'coverage never blocks: finish proceeds and notes that no coverage was recorded'
        - id: US-32.AC-3
          given: a recorded snapshot
          when: the agent calls get_overview
          then: it shows the overall percentage and the lowest-covered files with their percentages — the gaps agents should weigh
        - id: US-32.AC-4
          given: a recorded snapshot
          when: the board renders
          then: a coverage section lists overall and per-file percentages with the weakest files visually flagged
      approved_content_hash: e6ea5ab35ebfd082572f9967664b02932a7bfc1414c126b372c39f112887a577
      children:
        - id: AS-32
          kind: arch
          title: Snapshot beside the evidence, never a gate
