          body: 'Engine placement boundaries require the target activity to be approved and fresh before persisting placement. CreateNode with activity_id and slice and SetMapPosition share one activity approval check that distinguishes never approved from stale and reports the concrete activity id under CC-2. Existing activity existence, slice, rank and map complete rules remain intact. Placement remains unhashed story metadata: activity edits invalidate only the activity, never the placed story. Story creation without placement when no activity exists bypasses this rule unchanged. Implementation reuses existing store operations and mutation boundaries; no lock or transaction refactoring.'
