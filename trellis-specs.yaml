    - id: US-31
      kind: story
      title: Release commits carry trellis authority
      body: 'Found releasing the first foreign project: the release manifest commit ran through the freshly scaffolded pre-commit hooks and was blocked by the lint gate in the main worktree. Release commits are trellis-authored — like init and finish they must bypass the hooks trellis itself installed; and a failed release must not strand staged manifest files on the base branch.'
      status: done
      acceptance_criteria:
        - id: US-31.AC-1
          given: a repo with trellis-scaffolded hooks
          when: release commits FEATURES.md and the backup
          then: the commit runs with --no-verify — trellis is the authority its hooks defend
        - id: US-31.AC-2
          given: a release that fails after the merge
          when: the main worktree returns to the base branch
          then: no staged or written manifest files leak onto the base branch — the failure path resets them before checking out
      approved_content_hash: 55d6b25fbb2fbed482a58c4d9e5074cc0e15a6a91cf2c2d5a5874e617db29ada
      children:
        - id: AS-31
          kind: arch
          title: No-verify manifest commit with clean unwind
          body: The release manifest commit uses --no-verify like every other trellis-authored commit. The failure path resets staged paths and removes written manifest files on the release branch before restoring the base checkout.
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: 0bc86c1e2fe7d3df0fe96f3d0eb4a121cd692aeffe26723cb5a55f0633a37110
          approved_parent_hash: 55d6b25fbb2fbed482a58c4d9e5074cc0e15a6a91cf2c2d5a5874e617db29ada
          children:
            - id: DD-32
              kind: detail_design
              title: Release commit mechanics
              body: 'core.Release: git commit --no-verify for the manifest commit; the unwind is atomic — reset --hard to the pre-merge SHA, remove written manifest files, check out base, and delete the release branch when this release created it. A failed release leaves no trace.'
              approved_content_hash: 2eda8b07b4757c390a3a5993aaf100355728cb2f747e2e0093b2d6d3233ea135
              approved_parent_hash: 0bc86c1e2fe7d3df0fe96f3d0eb4a121cd692aeffe26723cb5a55f0633a37110
