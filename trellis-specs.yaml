    - id: US-23
      kind: story
      title: Boards served by the MCP server
      body: 'As a human I want the board UI available whenever an agent session is connected: the MCP server also serves the boards of every project over HTTP — an index to click into the board I care about, or a direct redirect when there is only one.'
      status: done
      activity: UA-7
      rank: 4
      slice: 2
      acceptance_criteria:
        - id: US-23.AC-1
          given: a starting MCP server (trellis serve)
          when: it comes up
          then: the board HTTP server starts automatically on 127.0.0.1:7420 (overridable via --board-addr, value off disables it) while the MCP protocol on stdio is untouched
        - id: US-23.AC-2
          given: several projects in the store
          when: the server root is opened
          then: an index page lists every project linking to its live board under /p/<project-id>/ (fresh render per request, SSE reload per project)
