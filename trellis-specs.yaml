          then: finish is blocked naming every missing path
        - id: US-13.AC-3
          given: a file path
          when: the agent calls specs_for_path
          then: all stories whose declared paths equal the path or are a folder prefix of it are returned
        - id: US-13.AC-4
          given: a file path
          when: the human runs trellis affected <path>
