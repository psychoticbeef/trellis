          approved_content_hash: 06841a57498a9d606f97d9f5f142ec0f5d11ae0f85b87ae7b02e640a182bcd41
          approved_parent_hash: d83c9cf6c178e9ea93bd3d61aa2b44353e25334f97bb7819871186a0230d23f1
    - id: US-13
      kind: story
      title: Spec-to-code paths
      body: As a development agent I want stories to declare which files or folders realize them, so specs point into the code, finish verifies the pointers, and a changed file leads back to its stories.
      status: done
      acceptance_criteria:
        - id: US-13.AC-1
          given: a story
          when: the agent sets a list of repo-relative paths on it
          then: the paths are stored as metadata (not part of the content hash), visible in the node report and the tree
        - id: US-13.AC-2
          given: a story declaring a path that does not exist in the repo
