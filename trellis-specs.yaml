          body: 'Through MCP against a real git repository: start a story, commit work in its worktree, dirty the worktree and assert abort is blocked; clean up, abort, assert worktree and branch gone and status refined; assert abort from refined is rejected; assert start afterwards creates a fresh worktree from base.'
