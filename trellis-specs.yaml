    - id: US-17
      kind: story
      title: Worktree isolation
      body: As the process owner I want every in_progress story to live in its own git worktree so parallel stories cannot pull branches out from under each other, the main worktree stays parked on the base branch, and direct commits on the base branch are blocked.
      status: done
      acceptance_criteria:
        - id: US-17.AC-1
          given: a refined story
          when: the agent runs start
          then: a dedicated worktree is created at .trellis-worktrees/<story> on branch feature/<story> from base (reusing the branch if it exists), the main worktree is untouched, and the reported message names the worktree path where all work must happen
        - id: US-17.AC-2
          given: one story already in_progress
          when: the agent starts a second story
          then: the second start succeeds with its own worktree — stories are parallel by construction
        - id: US-17.AC-3
          given: an in_progress story
          when: the agent runs finish
          then: the gates (up-to-date check, lint, tests, evidence, paths) run inside the story worktree; the merge happens via the main worktree on the base branch; worktree and branch are removed afterwards
        - id: US-17.AC-4
          given: an in_progress story
          when: the agent runs abort
          then: the story worktree must be clean, then worktree and branch are removed and the story is refined again
        - id: US-17.AC-5
          given: a repo where .trellis-worktrees is not git-ignored
          when: the agent runs start
          then: start is blocked telling the human to add .trellis-worktrees/ to .gitignore
        - id: US-17.AC-6
          given: the pre-commit hook installed
          when: someone commits while the current branch is the base branch
          then: 'the commit is blocked: work happens in story worktrees, the base branch only receives trellis merges'
      approved_content_hash: 751299f19f84a8f953c086f9710888651d818f1a459671dfb59c4e608a3c67cc
      children:
        - id: AS-17
          kind: arch
          title: One worktree per story, main worktree parked on base
          body: start/finish/abort own all worktree lifecycle via gitops (worktree add/remove, branch reuse). Story worktrees live under .trellis-worktrees/ inside the repo and must be git-ignored (checked with git check-ignore at start). Gates execute with the story worktree as working directory; only the merge touches the main worktree, which is expected to sit on the base branch. The branch gate (trellis gate branch) rejects commits on the base branch and is part of the scaffolded pre-commit hook; trellis merges are unaffected because git merge does not run pre-commit.
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: ea21ba1a1e2c2fad06b83c0677ca95321b9fd8169d2b23ec31f5df8817f43cfa
          approved_parent_hash: 751299f19f84a8f953c086f9710888651d818f1a459671dfb59c4e608a3c67cc
          children:
            - id: DD-18
              kind: detail_design
              title: gitops worktree operations
              body: 'gitops: WorktreeAdd(path, branch, base) with branch reuse, WorktreeRemove(path), IsIgnored(path); engine derives worktreePath(story) and threads it through start/finish/abort; finish merges via the main worktree after checking out base there.'
              approved_content_hash: 21eaeb92a8e696bb6e36601885ff7d622d931504c93001781913211ba0ffe1d4
              approved_parent_hash: ea21ba1a1e2c2fad06b83c0677ca95321b9fd8169d2b23ec31f5df8817f43cfa
              children:
                - id: UT-18
                  kind: unit_test
                  title: Worktree unit tests
                  body: Unit-test WorktreeAdd create/reuse, WorktreeRemove, IsIgnored, and the branch gate verdicts on base vs feature branches.
                  approved_content_hash: 451f7d8f4207e171ce8ce1904fc6af224ceead3e73dcaefce4302da03f152bdd
                  approved_parent_hash: 21eaeb92a8e696bb6e36601885ff7d622d931504c93001781913211ba0ffe1d4
                  evidence:
                    tests:
                        - trellis/internal/gitops::TestWorktreeOps_UT_18
                    recorded_at: "2026-08-30T09:26:39Z"
            - id: IT-17
              kind: integration_test
