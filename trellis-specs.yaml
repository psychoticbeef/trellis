trellis_export: 1
project:
    name: trellis
    description: 'Deterministic spec tracking and story gating for LLM-driven development: hash-approved spec trees, gated gitflow in worktrees, test evidence as the definition of done.'
    base_branch: develop
    release_branch: main
    lint_cmd: gofmt -l . | tee /dev/stderr | wc -l | grep -q "^ *0$" && go vet ./...
    test_cmd: mkdir -p reports && go run gotest.tools/gotestsum@latest --junitfile reports/tests.xml -- -coverprofile=reports/cover.out ./...
    junit_glob: reports/*.xml
glossary:
    - term: acceptance criterion
      definition: Structured given/when/then requirement on a story; every one must be covered by an acceptance test spec.
    - term: activity
      definition: Root node naming one user activity; ordered by position on the story map.
    - term: activity approval check
      definition: Placement requires target activity approved and fresh.
    - term: approval
      definition: Hash-proof that a reviewer read a node's current content; parents before children, dependencies re-pinned.
    - term: base branch
      definition: The branch that only receives trellis merges (default develop); direct commits are gate-blocked.
    - term: categorized token usage
      definition: Token usage split into input, output, cache_read, and cache_write for main-agent and subagents.
    - term: cross-cutting spec
      definition: Root-level architecture decision, referenced from arch specs via hash-pinned dependency links.
    - term: evidence
      definition: The proving tests recorded per test spec at finish; latest run replaces older records.
    - term: gate
      definition: 'A guard that must pass before a transition proceeds: structure, freshness, lint, tests, evidence, up-to-date branch.'
    - term: integrity marker
      definition: 'Story label: stale for invalidated approval, blocked for other integrity problems, fresh otherwise.'
    - term: lane
      definition: Stories sharing one activity and slice.
    - term: living context
      definition: Done specs stay editable so context tracks reality; honesty comes from stale markers, not locks.
    - term: map complete
      definition: At least one activity and no unmapped story; derived on every call, never stored.
    - term: open slice
      definition: Existing slice or next slice offered as placement candidate.
    - term: placement
      definition: A story's activity, rank and slice; metadata like paths, never hashed.
    - term: placement gate
      definition: 'While map complete: story creation without placement and set_map_position clearing placement reject; import and refine stay unchanged.'
    - term: placement hint
      definition: Transient story-creation guidance listing ranked activities and story map gaps.
    - term: prune
      definition: Hard delete of a done story's tree when its feature leaves the product; the only way spec content disappears.
    - term: sequencing link
      definition: 'Unpinned story-to-story dependency: start waits until the prerequisite story is done.'
    - term: slice
      definition: Integer release cut on the story map; soft priority for next_story, never a gate by itself.
    - term: spec tree
      definition: 'One story''s hierarchy: acceptance tests, exactly one arch spec, integration tests, detail designs, unit test specs.'
    - term: stale
      definition: An approval invalidated by a content, parent or dependency change; cleared only by re-approval.
    - term: story
      definition: 'Unit of work: a spec tree plus the gated lifecycle todo -> refined -> in_progress -> done.'
    - term: story detail overlay
      definition: Read-only overlay showing complete story context.
    - term: story map
      definition: 'Optional 2D view: activities left to right, stories ranked below, slices across.'
    - term: story map gap
      definition: Empty activity-by-slice cell through highest used slice.
    - term: story worktree
      definition: Per-story git worktree under .trellis-worktrees/ where all implementation work happens.
    - term: token usage
      definition: Persisted per-story counts for main-agent and subagent tokens.
    - term: uncategorized token usage
      definition: Token usage stored only as main-agent and subagent totals.
    - term: unmapped story
      definition: Story without placement; legal only while the map is incomplete.
    - term: walking skeleton
      definition: Slice 1 with at least one story under every activity.
