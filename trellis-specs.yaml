      children:
        - id: AS-45
          kind: arch
          title: Prospective derived placement invariant at mutation boundaries
          body: 'Engine derives map complete before every guarded mutation from current persisted data: at least one activity and no unmapped story. No flag, cache or config switch stores map state. Shared placement gate evaluation protects story creation without placement and any placement-clearing mutation. A mutation is rejected only when its pre-mutation state is map complete and its result would be map incomplete. Rejections follow machine-readable exhaustive errors and return deterministic activity and open-slice candidates. Map incomplete behavior, YAML import and refine remain unchanged except that placement targeting an activity always runs the activity approval check. Placement stays unhashed metadata.'
          depends_on:
