              title: Project-scoped map-position HTTP handler
              body: 'Board live handlers register relative `map-position` endpoints beside board and `events`: `/map-position` for the single-project live board and `/p/{project-id}/map-position` for multi-project serve. Endpoint accepts POST JSON with `story_id`, `activity_id`, and integer `slice`; other methods reject without mutation. Single-project handler uses its existing Engine; multi-project handler creates Engine for route project. Handler calls only Engine.SetMapPosition, never store mutation or an unlocked helper. Success returns 204 and existing event drives server-sent-events reload. Malformed requests and complete Engine errors return deterministic machine-readable JSON with appropriate non-success status. No lock or transaction code changes.'
