          children:
            - id: DD-9
              kind: detail_design
              title: Transition-only done semantics
              body: 'core: no guardDoneTree anywhere in CreateNode/UpdateNode/DeleteNode/AC ops/LinkDep; Transition verbs remain the only readers of the done status besides reporting.'
