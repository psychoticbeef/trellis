    - id: US-29
      kind: story
      title: Init wires and commits its own scaffold
      body: 'As a human bootstrapping a repo I want trellis init to leave a working setup behind in one step: wiring files committed by init itself, the worktree ignore line in place, and a warning when the trellis binary is not reachable where hooks and MCP config will look for it. Found while bootstrapping the first foreign project: hooks failed off-PATH and the fresh branch gate blocked the manual scaffold commit.'
      status: done
      activity: UA-1
      rank: 1
      slice: 2
      acceptance_criteria:
        - id: US-29.AC-1
          given: a git repository being initialized
          when: trellis init scaffolds wiring files
          then: init commits the newly created repo files on the current branch itself, bypassing the hooks it just installed — trellis is the authority those hooks defend, so no manual --no-verify bootstrap is needed
        - id: US-29.AC-2
          given: a repo whose .gitignore lacks the worktree entry
          when: trellis init runs
          then: the .trellis-worktrees/ line is ensured in .gitignore — created or appended, the single sanctioned amendment to an existing file, because start depends on it
        - id: US-29.AC-3
          given: a trellis binary not reachable via PATH
          when: trellis init runs
          then: init warns that the installed hooks and .mcp.json invoke trellis from PATH and names the fix
        - id: US-29.AC-4
          given: nothing newly created, or no git repository
          when: trellis init runs
          then: no commit is made — a second init leaves history untouched
      approved_content_hash: 1d8b4819242bfeb7119f6607dd4af7308eb1a302ea9708a8e4b15a6d758c4d2f
      children:
        - id: AS-29
          kind: arch
          title: Init finishes what it starts
          body: 'scaffold reports which repo files it created; init stages exactly those (plus an amended .gitignore) and commits them with --no-verify on the current branch — the same self-authority finish and release already exercise. The ignore line is ensured before hooks are considered. PATH reachability is checked with LookPath and surfaces as a scaffold message, never an error: init must succeed regardless.'
          depends_on:
