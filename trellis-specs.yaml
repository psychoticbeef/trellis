    - id: US-33
      kind: story
      title: Bidirectional audit
      body: 'As the process owner I want spec and reality validated in both directions, repo-wide and on demand: no spec without a living test, no spec-referencing test without its spec, no declared path pointing nowhere — and the dangerous backward file direction stays informational, because a README belongs to no feature and never should.'
      status: done
      acceptance_criteria:
        - id: US-33.AC-1
          given: a project with done stories
          when: trellis audit runs
          then: 'it executes the test command once and re-verifies every done story repo-wide: each test spec still has passing, non-skipped tests and every declared story path still exists — post-done drift becomes a violation'
        - id: US-33.AC-2
          given: tests whose names reference spec ids
          when: the audit scans the report
          then: a reference to a nonexistent spec node is a violation (rot after prune or renumbering); tests referencing no spec at all are listed informationally as unbound, never gated
        - id: US-33.AC-3
          given: files in the repository
          when: the audit compares them with all declared story paths
          then: unclaimed source files are listed informationally with common meta files (README, LICENSE, manifests, dotfiles) excluded — the backward file direction never blocks anything
        - id: US-33.AC-4
          given: an audit result
          when: it is consumed
          then: the audit never mutates, exits 0 without violations and 1 with them (informational findings never flip the code), and the same report is available to agents as an MCP tool
      approved_content_hash: 81c71173cf75cfd451b2715eda72058ed5a5afa568ebec3ef1b822954317362a
      children:
        - id: AS-33
          kind: arch
          title: One audit pass over report, specs and tree
          body: 'audit runs the configured test command in the main worktree, parses the JUnit report once, and walks: (forward) every done story''s test specs through the existing verifier plus declared path existence; (backward) every test case name for spec-id patterns resolved against live nodes, and git-tracked files against the union of declared paths with a meta-file exclusion list. Violations and infos stay separate; nothing mutates. Surface: trellis audit (CLI, exit code) and an audit MCP tool returning the same envelope.'
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: f40570e5202e9b13e6096e7c25bb6bfc4d16235deca4f696ab40467abdb719bf
          approved_parent_hash: 81c71173cf75cfd451b2715eda72058ed5a5afa568ebec3ef1b822954317362a
          children:
            - id: DD-34
              kind: detail_design
              title: Audit mechanics
              body: 'core.Audit: run test_cmd, ParseGlob; per done story reuse testreport.Verify and missingPathsIn against the repo root; backward scan via regex (AT|IT|UT)[-_]\\d+ over case names resolved with GetNode; unclaimed files via git ls-files minus PathCovers over all stories'' paths minus meta patterns; AuditReport{violations, infos}. CLI command audit; MCP tool audit with object envelope.'
              approved_content_hash: de3cac5086b4803e5b98376a3a6e4721ec70ffde45c4337eddc6b607b55c8c2f
              approved_parent_hash: f40570e5202e9b13e6096e7c25bb6bfc4d16235deca4f696ab40467abdb719bf
