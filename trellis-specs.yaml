          body: Activities are root nodes with UA ids from a monotonic per-kind counter and an integer position stored and ordered by the engine. Story placement references an activity id as metadata rather than composition or dependency, so activity edits cannot affect story content hashes or approval freshness. Engine activity CRUD owns default-position allocation, explicit reordering, and exhaustive delete guards. Overview, tree, next-story, audit, board and export read models add activity data only when at least one activity exists, preserving their prior output when no story map exists; doctor may emit the informational threshold suggestion defined by the living context.
