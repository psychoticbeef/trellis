              kind: detail_design
              title: Scaffold commit mechanics
              body: 'cmd/trellis: scaffold returns messages plus created repo-relative file list (hooks excluded); ensureIgnoreLine(repo) creates or appends .trellis-worktrees/; init stages created files and commits with git add + commit --no-verify -m ''trellis init: repo wiring''; LookPath(''trellis'') failure appends a warning message.'
              approved_content_hash: 1f39910cf0ca8200460fdea847df3360c1db65695384e8423f0e6762820fe1a6
              approved_parent_hash: fb00a76fa02857fe42d85fc728c7f082ec6e6f5a5fe6834705435efb51f1b9e0
