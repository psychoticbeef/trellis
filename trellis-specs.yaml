    - id: US-22
      kind: story
      title: Release cut with feature manifest
      body: As the release owner I want a single command that merges the base branch into the release branch with a merge message listing the newly released features, and maintains a FEATURES.md (feature headings plus glossary) that lives only on the release branch — the base branch stays clean because this flow never merges back (release fixes are cherry-picked).
      status: done
      acceptance_criteria:
        - id: US-22.AC-1
          given: done features merged into the base branch since the last release
          when: the human runs trellis release
          then: the base branch is merged --no-ff into the release branch (created from the base on first release, name configurable, default main) and the merge message lists each newly released feature as story id and title
        - id: US-22.AC-2
          given: a completed release
          when: the release branch is inspected
          then: 'FEATURES.md is current: all done story titles plus the full glossary; the file exists only on the release branch, never on the base branch'
        - id: US-22.AC-3
          given: no new feature merges since the last release
          when: the human runs trellis release
          then: 'the release is blocked: nothing to release'
        - id: US-22.AC-4
          given: stale specs or a dirty main worktree
          when: the human runs trellis release
          then: the release is blocked naming the stale nodes or the dirty state — a release snapshots honest context
      approved_content_hash: f1e15264f706efca71a7a6766c40f59054324c18684547596bf4579c7fc94eec
      children:
        - id: AS-22
          kind: arch
          title: Release as engine verb behind a CLI-only command
          body: 'Releasing is a human act: trellis release <project> stays off the MCP surface, like gate configuration. The engine computes the delta from git (merge subjects in release..base written by finish), blocks on stale specs and a dirty main worktree, creates the release branch from base on first use, merges --no-ff with the feature list in the message, regenerates FEATURES.md from done stories and the glossary, commits it on the release branch only, and parks the main worktree back on base. The release branch name is project config (release_branch, default main), editable only via the CLI.'
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: 10b0f347b23e159cf8a528457ac64032bcfa33605e9b2e83fcbd087f59f5ff0c
          approved_parent_hash: f1e15264f706efca71a7a6766c40f59054324c18684547596bf4579c7fc94eec
          children:
            - id: DD-23
              kind: detail_design
              title: Release mechanics
              body: 'engine.Release: stale/dirty guards, delta via git log release..base --merges parsing the ''Merge feature/US-n: title (trellis finish)'' subjects, branch create-on-first-use, checkout release, merge --no-ff with the feature list, write FEATURES.md (featuresMarkdown over done stories + glossary), commit, checkout base. store: release_branch column with additive migration; config flag --release.'
              approved_content_hash: ba91c9a5904b8b334b5b3356af8501883cf19a171d88126e4e5341f109bfe4ce
              approved_parent_hash: 10b0f347b23e159cf8a528457ac64032bcfa33605e9b2e83fcbd087f59f5ff0c
              children:
                - id: UT-23
                  kind: unit_test
                  title: Release building blocks unit tests
                  body: Unit-test parseFeatureSubjects on real and hostile merge subjects, and featuresMarkdown rendering (headings, glossary section, empty glossary).
                  approved_content_hash: f8fa9698ab0eff3887bb28701917256daa73fc453274d79e8aa6441c2d1186e3
                  approved_parent_hash: ba91c9a5904b8b334b5b3356af8501883cf19a171d88126e4e5341f109bfe4ce
                  evidence:
                    tests:
                        - trellis/internal/core::TestReleaseBuildingBlocks_UT_23
                    recorded_at: "2026-08-30T10:04:49Z"
            - id: IT-22
              kind: integration_test
