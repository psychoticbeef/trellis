    - id: US-4
      kind: story
      title: Cross-cutting architecture dependencies
      body: As an architect I keep cross-cutting decisions in root-level cross_cutting specs and reference them from story arch specs via hash-pinned links, so cross-cutting change forces every affected story to be re-reviewed without breaking the strict tree.
      status: done
      acceptance_criteria:
        - id: US-4.AC-1
          given: an unapproved cross_cutting spec
          when: the agent links a node to it
          then: the link is rejected until the target is approved and fresh
        - id: US-4.AC-2
          given: a node with dependencies
          when: the agent approves it
          then: approval requires the current content hash of every dependency target as proof of reading
        - id: US-4.AC-3
          given: an approved dependency graph
          when: a cross_cutting spec is edited
          then: all dependent nodes become stale and their stories drop to todo
        - id: US-4.AC-4
          given: a cross_cutting spec with dependents
          when: the agent tries to delete it
          then: deletion is blocked listing the dependents
      approved_content_hash: cc2bd7ac381497ef32ce0baddc89e81feaf1214c74a9da428866b9a2402f49ab
      children:
        - id: AS-4
          kind: arch
          title: 'Two edge types: child_of tree plus depends_on references'
          body: The composition tree stays a strict one-parent tree; cross-cutting reuse is a separate n:m depends_on edge set with pinned hashes. Freshness treats a pin mismatch exactly like a parent change. Links carry no content, so linking/unlinking never invalidates by itself.
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
