                  kind: unit_test
                  title: Search behaviour unit tests
                  body: 'Unit-test the search surface: punctuation-heavy and operator-carrying queries treated literally and error-free, one hit per node, empty-query and no-match behaviour. Query-builder internals are covered by US-19 UT-20.'
                  approved_content_hash: 7d94d8739e026f438c5581b6686286dcc23ddb1d135ac8f85203f470371e7535
                  approved_parent_hash: cdf4529e5b6507f60be19bc872a6581e1d2ca22fd615a9ff5691e6ac93f402ce
            - id: IT-12
              kind: integration_test
              title: Search integration
              body: 'Engine + store: matches across node fields and AC fields, case-insensitivity, dedup when several fields match, owning-story resolution for deep nodes.'
              approved_content_hash: d690560f9d4976cc78d77aca914a014d2a2fc08c5224bd2303efe090eca785fd
              approved_parent_hash: e69b389a06e6e3bdce6ebf17e9f4e54293e5278eceb74391de03ca20120f46a8
        - id: AT-14
          kind: acceptance_test
          title: Search acceptance
          body: 'Through MCP: seed several stories and cross-cutting specs, search by a word occurring only in a body, only in an AC, and mixed-case; assert hits carry id/kind/story/snippet; assert an unmatched query returns empty; assert get_overview lists every story and cross-cutting title. Term/ranking/prefix semantics are proven by US-19''s AT-23.'
          covers:
