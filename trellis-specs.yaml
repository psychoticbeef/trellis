    - id: US-36
      kind: story
      title: Coverage delta
      body: 'As a team we want each coverage snapshot to say how it moved: one scalar of memory, no history — enough to notice erosion.'
      status: done
      acceptance_criteria:
        - id: US-36.AC-1
          given: a previous coverage snapshot
          when: finish records a new one
          then: the finish message and the overview carry the signed delta of the overall percentage against the previous snapshot
        - id: US-36.AC-2
          given: no previous snapshot
          when: finish records the first one
          then: no delta is shown — never a misleading zero
      approved_content_hash: 8b34dba3ee1fed4653cafdd5c717404d196595a4bf668303d5b57d0c6e4ed38a
      children:
        - id: AS-36
          kind: arch
          title: Delta from the outgoing snapshot
          body: Before a snapshot replaces its predecessor, the old overall percentage is computed from the existing rows and the difference travels with the summary — no extra storage, no history.
          depends_on:
            - target: CC-4
              pinned_hash: e01e58b15446c1374ab40efa97c8e1a3fba3a4cb276bac96d2c7ecd6268e0c08
          approved_content_hash: bbed8ca2e3b72fe073dfffed05cfb9fd6b5cbf00ed57dcba387eb91c84fa60a0
          approved_parent_hash: 8b34dba3ee1fed4653cafdd5c717404d196595a4bf668303d5b57d0c6e4ed38a
          children:
            - id: DD-37
              kind: detail_design
              title: Delta plumbing
              body: 'recordCoverage computes the previous total from ListCoverage before SetCoverage and appends (+/-x.x) to the note; Overview.Coverage gains delta_pct as pointer, nil on first snapshot. The overview derives its delta from a prev_total column? No — recompute is impossible after replace, so the delta is stored as one scalar on the snapshot rows'' shared metadata: a single coverage_meta row per project holding prev_total_pct.'
              approved_content_hash: afc938eee802b08d2b722078678374bed5452578cb4fb40ffb289053922228d9
              approved_parent_hash: bbed8ca2e3b72fe073dfffed05cfb9fd6b5cbf00ed57dcba387eb91c84fa60a0
              children:
                - id: UT-37
                  kind: unit_test
                  title: Delta plumbing unit tests
                  body: Unit-test delta math incl. sign, the nil-on-first behaviour, and meta persistence across snapshot replacement.
                  approved_content_hash: 1e3ae4371203cfdf4c10c96d364cff820fae03812377fd5a3e7fc51cdf5f34d7
                  approved_parent_hash: afc938eee802b08d2b722078678374bed5452578cb4fb40ffb289053922228d9
                  evidence:
                    tests:
                        - trellis/internal/core::TestCoverageDeltaUnit_UT_37
                    recorded_at: "2026-08-30T20:03:52Z"
            - id: IT-36
              kind: integration_test
              title: Coverage delta integration
              body: 'Engine + repo: first finish no delta, second finish signed delta both directions, overview field.'
              approved_content_hash: 0ee85baf5c8973a7b7897c7934dd6966b8e5e3d53f6720ce245579220730cef7
              approved_parent_hash: bbed8ca2e3b72fe073dfffed05cfb9fd6b5cbf00ed57dcba387eb91c84fa60a0
