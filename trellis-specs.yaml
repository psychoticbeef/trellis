    - id: US-21
      kind: story
      title: Project glossary
      body: As a team I want project terms defined once, ultra-short, and pushed into every surface, so specs and conversation keep one consistent wording.
      status: done
      acceptance_criteria:
        - id: US-21.AC-1
          given: a project
          when: the agent defines a term with a definition
          then: the term is stored; definitions above 240 characters or terms above 64 characters are rejected — glossary entries stay ultra short
        - id: US-21.AC-2
          given: an existing term
          when: the agent defines it again or deletes it
          then: define updates the definition in place; delete removes it; deleting an unknown term errors
        - id: US-21.AC-3
          given: any project state
          when: the agent calls get_overview
          then: the complete glossary is listed — it is small by design and always in context
        - id: US-21.AC-4
          given: a rendered board
          when: spec texts contain glossary terms
          then: the board shows a glossary section and marks term occurrences in bodies and acceptance criteria with hover definitions linking to the glossary entry
      approved_content_hash: 2d3e1d9aeb52dd095a97115690758f04f5a54fe5fc437bbbb778b89272bd7e87
      children:
        - id: AS-21
          kind: arch
          title: One table, marked everywhere it renders
          body: Glossary entries live in their own table (term unique per project, length limits enforced in the engine) — metadata like paths, no approval hashes. The board escapes spec text first, then wraps case-insensitive whole-word term occurrences (longest term first) in anchors with the definition as hover title, linking to the glossary section. The MCP server instructions tell agents to check the glossary and reuse its exact wording.
          depends_on:
            - target: CC-1
              pinned_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
          approved_content_hash: 3463a018de83cba1b1de46c7b0ea1fa2f0f025c75cd84c6049e24f53b967f786
