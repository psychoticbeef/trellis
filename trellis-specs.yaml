          body: Keep the guarded atomic additive upsert for uncategorized token usage and categorized token usage. When the upsert changes no row because one or more additions exceed MaxInt64, inspect current persisted counters, compare every incoming addition without overflowing arithmetic, and return one deterministic error containing the story ID and all affected counter names in schema order. Rejected reports mutate no counter and append no success event; valid additions through the exact MaxInt64 boundary retain existing behavior.
