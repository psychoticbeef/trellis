    - id: US-6
      kind: story
      title: Git flow and test evidence
      body: As the process owner I want start/finish to orchestrate git directly — feature branch per story, merge only after lint, tests and per-spec test evidence — so that the merge into the base branch is a verdict trellis reaches itself, never a claim the agent makes.
      status: done
      acceptance_criteria:
        - id: US-6.AC-1
          given: a refined story and a clean worktree
          when: the agent runs start
          then: a dedicated worktree on branch feature/US-n is created from the base branch (or the branch is reused) and the story is in_progress; the main worktree is untouched
        - id: US-6.AC-2
          given: a missing base branch or a repo where the worktree directory is not git-ignored
          when: the agent runs start
          then: start is blocked naming the missing branch or the missing .gitignore entry
        - id: US-6.AC-3
          given: an in_progress story on its feature branch
          when: the agent runs finish
          then: trellis runs the lint command, runs the test command, parses the JUnit reports and requires for every acceptance/integration/unit test spec at least one non-skipped passing test whose name references the spec id (UT-3 or UT_3, boundary-safe)
        - id: US-6.AC-4
          given: missing or empty JUnit reports
          when: finish verifies evidence
          then: finish is blocked; an absent report is an error, never an empty pass
        - id: US-6.AC-5
          given: all gates green
          when: finish completes
          then: the feature branch is merged --no-ff into the base branch via the main worktree, then worktree and branch are removed; on merge conflict the merge is aborted and the main worktree stays clean on base
      approved_content_hash: fc12b7243af383b8c35ae2ad729069b9056802e71ca25b90f4320dd62a0d6f50
      children:
        - id: AS-6
          kind: arch
          title: Gitflow by construction
          body: 'The agent never merges: start and finish own all git side effects via gitops (branch create/checkout, --no-ff merge, abort recovery). Test verdicts come from parsing JUnit XML — language-agnostic — matched to spec ids by boundary-safe name search. Gate commands are project config, editable only via CLI.'
          depends_on:
            - target: CC-1
              pinned_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: ea56faba36d09934d8e4dc3044c3c9c93a9fe16ea2cdffbae03ffdb2f10acaec
          approved_parent_hash: fc12b7243af383b8c35ae2ad729069b9056802e71ca25b90f4320dd62a0d6f50
          children:
            - id: DD-6
              kind: detail_design
              title: JUnit evidence matching
              body: testreport parses nested testsuites; a test proves spec X-n iff its classname::name matches (?i)boundary X[-_]n non-digit-boundary; failures, errors and skips all count against; zero matching report files is an error.
              approved_content_hash: b1361532ad36105010da32765adada5e9dd281cb88cad23210430eff7ccfc771
              approved_parent_hash: ea56faba36d09934d8e4dc3044c3c9c93a9fe16ea2cdffbae03ffdb2f10acaec
              children:
                - id: UT-6
                  kind: unit_test
                  title: Matcher unit tests
                  body: Unit-test boundary behaviour (UT-3 vs UT-31), case and separator variants, nested suite collection, and Verify's per-spec problem lines.
                  approved_content_hash: 19eb8b703768add6e89eb71d85cc2f550d298cce78d25595972e962a520edce2
                  approved_parent_hash: b1361532ad36105010da32765adada5e9dd281cb88cad23210430eff7ccfc771
            - id: DD-7
              kind: detail_design
              title: Merge orchestration
              body: gitops.MergeBranch merges a feature branch --no-ff into base via the main worktree (which must be clean and is checked out on base); on conflict the merge is aborted and base stays untouched. WorktreeAdd/WorktreeRemove/DeleteBranch own branch lifecycle; finish removes worktree and branch after the merge.
              approved_content_hash: 6fa7609ae3da46be4468fc46b15ae529e27e74392680e5ce4ab310d3ec9fe1f2
              approved_parent_hash: ea56faba36d09934d8e4dc3044c3c9c93a9fe16ea2cdffbae03ffdb2f10acaec
              children:
                - id: UT-7
                  kind: unit_test
                  title: Merge orchestration unit tests
                  body: 'Unit-test MergeBranch: dirty-main rejection, --no-ff merge commit on base, conflict abort leaving base clean and unmoved, plus worktree/branch cleanup, against a throwaway git repo.'
                  approved_content_hash: fa25fc0d7b2ec1f23143b8e2e851a627ab98127433b9eac63c10ae4bf9e7f7e0
                  approved_parent_hash: 6fa7609ae3da46be4468fc46b15ae529e27e74392680e5ce4ab310d3ec9fe1f2
            - id: IT-6
              kind: integration_test
              title: Finish pipeline integration
              body: 'Engine + real git repo + generated JUnit files: evidence verification wired into finish, merge and branch deletion on success, precise blocking errors otherwise.'
              approved_content_hash: 8d0d06ead9152533dffafb707dbf40e8790383c2da42b0ed65e184b71f4d957d
              approved_parent_hash: ea56faba36d09934d8e4dc3044c3c9c93a9fe16ea2cdffbae03ffdb2f10acaec
        - id: AT-6
          kind: acceptance_test
          title: Git flow acceptance
          body: 'Against a real git repository driven through MCP: start/finish happy path, each blocking condition (dirty worktree, missing base, missing spec evidence, failing/skipped test, absent report). A base branch that advanced after start is blocked by the up-to-date merge gate (US-9) before any merge is attempted; the catch-up path (merge base into feature) then finishes green. Merge-conflict abort recovery remains covered at the gitops unit level as a defensive path.'
          covers:
            - US-6.AC-1
            - US-6.AC-2
            - US-6.AC-3
            - US-6.AC-4
            - US-6.AC-5
          approved_content_hash: e8a89aac3e001da4085f625f1049c2ad0f8f01465481bd82d4f16b715236aad1
          approved_parent_hash: fc12b7243af383b8c35ae2ad729069b9056802e71ca25b90f4320dd62a0d6f50
    - id: US-10
      kind: story
      title: Abort transition
      body: 'As a development agent I want to abandon an in_progress story whose approach turned out wrong: discard the feature branch, return to the base branch, and fall back to refined so the spec survives while the work is dropped.'
      status: done
      acceptance_criteria:
        - id: US-10.AC-1
          given: an in_progress story with a clean worktree
          when: the agent runs abort
          then: the story worktree and the feature branch are removed and the story is refined again; the main worktree is untouched
        - id: US-10.AC-2
          given: a dirty story worktree
          when: the agent runs abort
          then: 'abort is blocked: commit or stash first — work is never silently destroyed'
        - id: US-10.AC-3
          given: a story that is not in_progress
          when: the agent runs abort
          then: the transition is rejected naming the required status
      approved_content_hash: 411d0097da856137ca9ab27c309cd6428c8213eb7f80be60769abde1a85495b1
      children:
        - id: AS-10
          kind: arch
          title: Fourth verb on the state machine
          body: 'abort is a transition verb (in_progress -> refined) with git side effects owned by gitops: checkout base, branch -D feature. The spec tree is untouched — refined is re-entered without re-running integrity because nothing about the spec changed.'
          depends_on:
