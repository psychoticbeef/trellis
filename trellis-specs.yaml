              body: Live serving augments shared Render output with one embedded dependency-free script; static export receives unchanged Render output. Script marks only story map cards draggable, captures card parent and next sibling before movement, identifies target cell activity and slice data, optimistically moves card, and sends JSON to relative `map-position`. On non-success, malformed response, or network failure it restores card to captured parent and order and writes full returned error text into an in-page `role=alert` error surface using textContent. On success it waits for existing server-sent-events reload. Drag is ignored outside valid activity-by-slice cells. Script and styles use no external assets and issue no other mutation.
