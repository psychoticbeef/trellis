          body: 'Drive the real init entrypoint on a fresh repo: assert the wiring commit on the current branch (containing .mcp.json, AGENTS.md, .gitignore; hooks installed but never committed), a clean worktree afterwards, and that start works immediately without manual ignore editing; assert appending to a pre-existing .gitignore; assert the PATH warning with a stripped PATH; assert a second init creates no commit.'
