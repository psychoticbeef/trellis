    - id: US-44
      kind: story
      title: Story placement
      body: New MCP tool set_map_position(story_id, activity_id, slice) stores placement as metadata; rank is appended automatically at the end of the activity's stories in that slice. create_node kind=story accepts optional activity_id and slice. Placement appears on story nodes in get_node, get_tree and get_overview and round-trips through YAML export and import.
      status: done
