        - id: US-26.AC-2
          given: the current hashes of every tree node and of every pinned dependency target
          when: the agent calls approve_tree
          then: 'the whole tree is approved top-down in one call and dependency pins are refreshed — the read-proof granularity moves from node to tree, no weaker: whoever has the hashes had the full content'
        - id: US-26.AC-3
