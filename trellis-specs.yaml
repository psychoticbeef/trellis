    - id: US-34
      kind: story
      title: Setup doctor
      body: 'As a human I want one command that detects and repairs setup drift: the wiring rots quietly (hooks from an older generation, a binary off PATH, a missing ignore line) and every drift class has already bitten us once.'
      status: done
      acceptance_criteria:
        - id: US-34.AC-1
          given: a wired repository
          when: trellis doctor runs
          then: it checks the full wiring matrix — trellis on PATH, git repo with base and release branches, worktree ignore line, hooks present AND current generation, .mcp.json referencing the project, AGENTS.md pointer, gate config — and reports each item as ok, warn or fail
        - id: US-34.AC-2
          given: drift in artifacts trellis owns
          when: trellis doctor --fix runs
          then: hooks are rewritten to the current generation, the ignore line is ensured, missing .mcp.json or AGENTS.md are scaffolded create-if-absent; user-owned problems (missing branches, unconfigured gates) are reported with the exact command and never auto-executed
        - id: US-34.AC-3
          given: a doctor run without --fix
          when: it completes
          then: nothing was mutated, and the exit code is 0 without failures and 1 with them
      approved_content_hash: a33811fc8ed5d5a37291d842328ee9403bdc5a8c9ef05e7ae85749a6f90a0bdd
      children:
        - id: AS-34
          kind: arch
          title: Checks shared with the scaffolder
          body: doctor reuses the scaffold building blocks (hook templates, ignore ensure, wiring templates) so 'current generation' is by construction whatever scaffold writes today; checks are pure functions over repo+ config returning ok/warn/fail findings, --fix maps each trellis-owned failure to its scaffold writer.
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: 3e79e8c1a9443653191cb91792f1a94563ebbdad5c777355d8ee9cf005c5596d
          approved_parent_hash: a33811fc8ed5d5a37291d842328ee9403bdc5a8c9ef05e7ae85749a6f90a0bdd
