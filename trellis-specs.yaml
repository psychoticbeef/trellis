cross_cutting:
    - id: CC-1
      kind: cross_cutting
      title: Hidden database, MCP-only writes
      body: The SQLite database lives outside every managed repository ($TRELLIS_DATA_DIR, default ~/.local/share/trellis). Agents read and write exclusively through the MCP tool surface; there is no MCP tool that can reconfigure gate commands (lint/test/junit are CLI-only). The store layer contains no business rules — every mutation passes the engine's guards.
      approved_content_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
    - id: CC-2
      kind: cross_cutting
      title: Machine-readable exhaustive errors
      body: Every rejected operation returns an error that (a) names the violated rule, (b) lists ALL current violations, not just the first, and (c) names the concrete node/AC ids involved, so an agent can repair everything in one pass. Errors never leak information that would allow blind retries (e.g. approve never echoes the expected hash).
      approved_content_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
    - id: CC-3
      kind: cross_cutting
      title: Append-only event log
      body: Every mutation appends an event (create/update/delete/approve/link/transition/auto_downgrade/prune) with timestamp and detail. The log is invisible to agents; humans read it via `trellis log`. A failed event write never blocks the mutation itself.
      approved_content_hash: 73ad83583b38b453fce0cd7a9c84ea300e5f84cd014b107d01b14ce9286cffb9
    - id: CC-4
      kind: cross_cutting
      title: Done specs are living context
      body: 'trellis keeps no obsolete content: no superseded states, no soft deletes, no archive. Done story trees are the durable context source and must track reality: they stay editable after done, so context is corrected in place instead of superseded. Honesty comes from hashes, not locks — every unreviewed change shows as a stale marker until someone re-reads and re-approves, and done stories are never reopened automatically. When a feature leaves the product, prune removes its tree whole.'
      approved_content_hash: e01e58b15446c1374ab40efa97c8e1a3fba3a4cb276bac96d2c7ecd6268e0c08
    - id: CC-5
      kind: cross_cutting
      title: Story map, optional until complete
      body: 'Placement data (activity, rank, slice) is never part of a content hash, never invalidates an approval, and never required while the map is incomplete. A project without activities behaves exactly as today in every tool, view, message and export: no extra output, no hints, no tabs, except doctor emits one informational story map suggestion at ten or more stories. Once map complete holds, the placement gate is active and no mutation may leave a story unmapped; the only way back is deleting every story and activity. Map state is derived from the data on every call; there is no flag and no config switch. Errors follow CC-2: exhaustive, listing every activity and open slice as candidates. Placement is settable via MCP (activity, slice) with rank appended automatically.'
      approved_content_hash: 86415fa6f5b2e48a8154db3566e4837a145592dbad640f46ea4046b338dfe491
