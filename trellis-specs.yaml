stories:
    - id: US-1
      kind: story
      title: Spec tree management
      body: As a development agent I manage a strict spec tree per user story (story -> acceptance tests + one arch spec -> integration tests + detail designs -> unit test specs) so that every feature is fully specified before implementation starts.
      status: done
      paths:
        - internal/core/engine.go
        - internal/core/engine_test.go
        - internal/core/matrix_test.go
        - internal/mcpserver/server.go
        - internal/mcpserver/server_test.go
        - internal/model/model.go
        - internal/model/model_test.go
      activity: UA-2
      rank: 1
      slice: 1
      acceptance_criteria:
        - id: US-1.AC-1
          given: a project
          when: the agent creates a node with a valid kind and parent
          then: the node is stored with a unique, never-reused id (US-n, AT-n, ...) and returned with its content hash
        - id: US-1.AC-2
          given: an existing tree
          when: the agent attempts an illegal structural move (wrong parent kind, second arch spec, parent on a root kind, unknown kind)
          then: the operation is rejected with an error naming the violated rule
        - id: US-1.AC-3
          given: a node with children or dependents
          when: the agent tries to delete it
          then: deletion is blocked and the error lists every referencing node
      approved_content_hash: fb0ed6c15b7fe8e4983db58f9f930dfbcf3f82877e3c34355c869ca9248ef421
      children:
        - id: AS-1
          kind: arch
          title: Engine-mediated tree storage
          body: All node CRUD flows through core.Engine; the store layer only persists. Tree legality is a declarative parent-kind map plus per-rule guards (arch singleton, covers validation). Ids come from monotonic per-kind counters that never reset, so ids are never reused after deletes.
          depends_on:
            - target: CC-1
              pinned_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: a112498c2c03f12d48e459b1335148ec05bf6f76d6fc49cd4f2c2870ed2c94bf
          approved_parent_hash: fb0ed6c15b7fe8e4983db58f9f930dfbcf3f82877e3c34355c869ca9248ef421
          children:
            - id: DD-1
              kind: detail_design
              title: Tree rule validation
              body: CreateNode/UpdateNode/DeleteNode validate against model.ParentKind and per-kind rules before any write; DeleteNode collects children and dependents into one blocking error; story deletion removes its ACs.
              approved_content_hash: 83c8ddbeeb6c406918690c7472c6f33cb47c5afc2d6cc6d636a69ea2c2b1f24a
              approved_parent_hash: a112498c2c03f12d48e459b1335148ec05bf6f76d6fc49cd4f2c2870ed2c94bf
              children:
                - id: UT-1
                  kind: unit_test
                  title: Parent-kind matrix unit tests
                  body: Unit-test the parent/child legality matrix for all eight kinds, including activity roots, the arch-singleton rule and id allocation monotonicity, directly against the engine with an in-memory store.
                  approved_content_hash: 2eac2eae359c878eb90e87cfb309cc01fc1f1e4f1a4f610553ecb63120e9b845
                  approved_parent_hash: 83c8ddbeeb6c406918690c7472c6f33cb47c5afc2d6cc6d636a69ea2c2b1f24a
            - id: IT-1
              kind: integration_test
              title: Engine CRUD guard integration
              body: 'Engine + real SQLite store: every guard rejection (illegal parent, second arch, delete with children/dependents) and every happy path, asserting persisted state after each step.'
              approved_content_hash: fce8abfc47eb397bb02b79da69b203b903fc05efcf2839d25bf82f44123ebfeb
              approved_parent_hash: a112498c2c03f12d48e459b1335148ec05bf6f76d6fc49cd4f2c2870ed2c94bf
        - id: AT-1
          kind: acceptance_test
          title: Node lifecycle acceptance
          body: 'Drive the full node lifecycle through the MCP interface against a real server: create a valid tree, attempt each illegal structural move, delete a referenced node. Assert stored ids, returned hashes and exact error contents.'
          covers:
            - US-1.AC-1
            - US-1.AC-2
            - US-1.AC-3
          approved_content_hash: b131f29f298697f85096a545a378314013e3a14b7429c7c8390af545691982c0
          approved_parent_hash: fb0ed6c15b7fe8e4983db58f9f930dfbcf3f82877e3c34355c869ca9248ef421
    - id: US-2
      kind: story
      title: Structured acceptance criteria
      body: As a product owner I express acceptance criteria as structured given/when/then triples attached to a story so that coverage is mechanically checkable instead of prose interpretation.
      status: done
      paths:
        - internal/model/model.go
        - internal/model/model_test.go
      activity: UA-2
      rank: 2
      slice: 1
      acceptance_criteria:
        - id: US-2.AC-1
          given: a story
          when: the agent adds an acceptance criterion with non-empty given/when/then
          then: it is stored with id US-n.AC-m and appears in the story's node report
        - id: US-2.AC-2
          given: a refined story
          when: any acceptance criterion is edited
          then: the story's content hash changes, all child approvals become stale and the story drops back to todo
        - id: US-2.AC-3
          given: an acceptance criterion covered by an acceptance test
          when: the agent tries to delete it
          then: deletion is blocked naming the covering test specs
      approved_content_hash: 3e38cb60948d50f3272d9bfbbe03cb77612faeed5b69b3f6a35831cecdd556aa
      children:
        - id: AS-2
          kind: arch
          title: ACs as hashed story content
          body: ACs are first-class rows (own table, own per-story counter) but hash into the story's canonical content document, sorted by id. Coverage is a covers list on acceptance_test nodes, validated against existing AC ids on every write.
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: 963eb4ce4d511bb2c80f40c2cbd93a06f40add3e35ba865e2a0ae10ec9d7e67c
          approved_parent_hash: 3e38cb60948d50f3272d9bfbbe03cb77612faeed5b69b3f6a35831cecdd556aa
          children:
            - id: DD-2
              kind: detail_design
              title: AC storage and hashing
              body: acceptance_criteria table keyed per project; model.ContentHash embeds sorted AC docs for stories; AddAC/UpdateAC/DeleteAC route through downgradeAffected.
              approved_content_hash: 39a0b9af2224dc7e87e9470702aac78b33bf03593a607f2282629eb522f680ca
              approved_parent_hash: 963eb4ce4d511bb2c80f40c2cbd93a06f40add3e35ba865e2a0ae10ec9d7e67c
              children:
                - id: UT-2
                  kind: unit_test
                  title: Story hash unit tests
                  body: Unit-test that AC order does not change the story hash, that any AC field edit does, and that covers order is canonicalized.
                  approved_content_hash: 9469c9eb70e9dd0bae8d4bbc25c42507cad83a377a419d564492b1fe82ce547f
                  approved_parent_hash: 39a0b9af2224dc7e87e9470702aac78b33bf03593a607f2282629eb522f680ca
            - id: IT-2
              kind: integration_test
              title: AC-story hash integration
              body: 'Engine + store: AC add/edit/delete each change the story hash; child freshness and story status react; covers validation rejects unknown AC ids listing the known ones.'
              approved_content_hash: c4b1c0f8b35e4b1353fe25ed2ee279fac544e881f4402bec252026dd1bb02da3
              approved_parent_hash: 963eb4ce4d511bb2c80f40c2cbd93a06f40add3e35ba865e2a0ae10ec9d7e67c
        - id: AT-2
          kind: acceptance_test
          title: AC lifecycle acceptance
          body: 'Through MCP: add/update/delete ACs on a story, assert hash change on edit, automatic story downgrade, and the blocked delete while covered.'
          covers:
            - US-2.AC-1
            - US-2.AC-2
            - US-2.AC-3
          approved_content_hash: 7bcc0e297954380dd380012744d23bab31ba1b031c810a57729f9951cbe8d710
          approved_parent_hash: 3e38cb60948d50f3272d9bfbbe03cb77612faeed5b69b3f6a35831cecdd556aa
    - id: US-3
      kind: story
      title: Hash-based approval and invalidation
      body: As the process owner I want every spec node explicitly approved against the exact content that was read, and every edit to invalidate dependent approvals, so that nothing enters development on stale understanding.
      status: done
      activity: UA-3
      rank: 1
      slice: 1
      acceptance_criteria:
        - id: US-3.AC-1
          given: any node
          when: the agent approves it passing the node's current content hash
          then: the approval is recorded together with the parent's current hash
        - id: US-3.AC-2
          given: a node whose content changed since the agent read it
          when: the agent approves with the old hash
          then: approval is rejected and the agent is told to re-read the node; the expected hash is not revealed
        - id: US-3.AC-3
          given: a node whose parent is not approved and fresh
          when: the agent tries to approve the node
          then: approval is rejected demanding top-down approval
        - id: US-3.AC-4
          given: an approved tree
          when: any node in it is edited
          then: the edited node and all its children/dependents become stale with reasons naming old and new short-hashes, and affected refined/in_progress stories drop to todo
      approved_content_hash: d3a2991aacc09bc80ceb50f4d65d4dada6d217294f44fd4ff1900493d88f12f8
      children:
        - id: AS-3
          kind: arch
          title: Hash-pinned approvals with computed freshness
          body: 'Approval stores (approved_content_hash, approved_parent_hash) on the node; dependency edges store a pinned target hash. Freshness is always computed, never cached: a node is fresh iff its own, its parent''s and all pinned hashes match current content. Story downgrades are the only eagerly-written consequence.'
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
            - target: CC-4
              pinned_hash: e01e58b15446c1374ab40efa97c8e1a3fba3a4cb276bac96d2c7ecd6268e0c08
          approved_content_hash: 90527130660104d2223acbde44a0150035ce3ab24d3aa90907638fb46b36bd4e
          approved_parent_hash: d3a2991aacc09bc80ceb50f4d65d4dada6d217294f44fd4ff1900493d88f12f8
          children:
            - id: DD-3
              kind: detail_design
              title: Freshness computation
              body: core.freshness derives approval validity from hash comparison alone; reasons are exhaustive and name ids plus 12-char short hashes; downgradeAffected finds the owning story and stories of direct dependents.
              approved_content_hash: d0b5323d8ca03a86650adbc3910af2bf99f5d8bdf44095e2cbef3fcd4f214ea5
              approved_parent_hash: 90527130660104d2223acbde44a0150035ce3ab24d3aa90907638fb46b36bd4e
              children:
                - id: UT-3
                  kind: unit_test
                  title: Freshness reason unit tests
                  body: Unit-test each freshness reason string (never approved, content changed, parent changed, dependency changed) and that approval re-pins dependency hashes.
                  approved_content_hash: fd8c0e57aba8ec6ad66cf0d806f35e3bd0117f2836c54487efd9bfa648a8ca59
                  approved_parent_hash: d0b5323d8ca03a86650adbc3910af2bf99f5d8bdf44095e2cbef3fcd4f214ea5
            - id: IT-3
              kind: integration_test
              title: Invalidation cascade integration
              body: 'Engine + store: edits at every tree level (story AC, arch, detail design, cross-cutting target) produce the correct stale set, freshness reasons and automatic downgrades.'
              approved_content_hash: c0e5de84a0b55b1ecc95953eed8635a1a91f113fb804edd9756c2c1786b1ed37
              approved_parent_hash: 90527130660104d2223acbde44a0150035ce3ab24d3aa90907638fb46b36bd4e
        - id: AT-3
          kind: acceptance_test
          title: Approval flow acceptance
          body: 'Through MCP: approve with wrong hash, approve child before parent, approve a full tree top-down, edit a mid-tree node and assert the stale cascade and story downgrade.'
          covers:
            - US-3.AC-1
            - US-3.AC-2
            - US-3.AC-3
            - US-3.AC-4
          approved_content_hash: a3cf8437b568d07486bdd4e523a480db0590c90a5f5e3343cb2b4dab92407e5d
          approved_parent_hash: d3a2991aacc09bc80ceb50f4d65d4dada6d217294f44fd4ff1900493d88f12f8
    - id: US-4
      kind: story
      title: Cross-cutting architecture dependencies
      body: As an architect I keep cross-cutting decisions in root-level cross_cutting specs and reference them from story arch specs via hash-pinned links, so cross-cutting change forces every affected story to be re-reviewed without breaking the strict tree.
      status: done
      activity: UA-2
      rank: 3
      slice: 1
      acceptance_criteria:
        - id: US-4.AC-1
          given: an unapproved cross_cutting spec
          when: the agent links a node to it
          then: the link is rejected until the target is approved and fresh
        - id: US-4.AC-2
          given: a node with dependencies
          when: the agent approves it
          then: approval requires the current content hash of every dependency target as proof of reading
        - id: US-4.AC-3
          given: an approved dependency graph
          when: a cross_cutting spec is edited
          then: all dependent nodes become stale and their stories drop to todo
        - id: US-4.AC-4
          given: a cross_cutting spec with dependents
          when: the agent tries to delete it
          then: deletion is blocked listing the dependents
      approved_content_hash: cc2bd7ac381497ef32ce0baddc89e81feaf1214c74a9da428866b9a2402f49ab
      children:
        - id: AS-4
          kind: arch
          title: 'Two edge types: child_of tree plus depends_on references'
