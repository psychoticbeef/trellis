    - id: US-11
      kind: story
      title: Story sequencing dependencies
      body: As a planner I want to declare that one story builds on another, so an agent cannot start dependent work before its prerequisite is done.
      status: done
      acceptance_criteria:
        - id: US-11.AC-1
          given: two stories
          when: the agent links one story to another as dependency
          then: a sequencing link is created regardless of the target story's refinement state — sequencing links carry no hash pin
        - id: US-11.AC-2
          given: a story whose dependency story is not done
          when: the agent runs start
          then: start is blocked naming each unfinished dependency and its current status
        - id: US-11.AC-3
          given: all dependency stories done
          when: the agent runs start with gates green
          then: start proceeds
        - id: US-11.AC-4
          given: a link that would create a cycle among story dependencies
          when: the agent links it
          then: the link is rejected naming the cycle
      approved_content_hash: d2ce943e7a919ba6a17e54327455c31faa2b9fc4396eb59a7c367d64cc9a8c98
      children:
        - id: AS-11
          kind: arch
          title: Unpinned sequencing edges
          body: 'Story-to-story links reuse the deps table with an empty pinned hash as the sequencing sentinel: freshness and approval ignore unpinned edges, so a dependency on an evolving story never stales the dependent spec. start walks the story''s sequencing edges and requires every target story to be done. Cycle prevention is a DFS over story-to-story edges at link time.'
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: 70b4dac1f63291e742a7a88221cc1fd256d719cc0668d819942dda72b8168813
          approved_parent_hash: d2ce943e7a919ba6a17e54327455c31faa2b9fc4396eb59a7c367d64cc9a8c98
          children:
            - id: DD-12
              kind: detail_design
              title: Sequencing link semantics
              body: 'core: LinkDep detects story->story and skips the target-fresh guard, storing pinned_hash=''''; freshness and Approve skip empty pins; start guard lists unfinished dependencies; linkWouldCycle does DFS over story edges.'
              approved_content_hash: 903648dafb92fd099b9a91e7e7397645b54b7be9ddd9e4d746a21a61956b33f0
              approved_parent_hash: 70b4dac1f63291e742a7a88221cc1fd256d719cc0668d819942dda72b8168813
              children:
                - id: UT-12
                  kind: unit_test
                  title: Sequencing unit tests
                  body: 'Unit-test the sentinel semantics: no freshness coupling, approve without dep_hashes for sequencing links, start guard message per dependency, cycle detection on direct and transitive cycles.'
                  approved_content_hash: c58b72ed0bc8785ed6790bfac5746e5f0a2d6348f9cfb6e3ec47c82c12cd586c
                  approved_parent_hash: 903648dafb92fd099b9a91e7e7397645b54b7be9ddd9e4d746a21a61956b33f0
            - id: IT-11
              kind: integration_test
              title: Sequencing integration
              body: 'Engine + store + git repo: unpinned link creation in any target state, start blocked with per-dependency lines, unblocked after the dependency finishes, cycle rejection across a three-story chain.'
              approved_content_hash: c9388d43d656d434cc44c0d5d09882f5c74c2a9fbd8df4ee73b95d5a7a5c3650
              approved_parent_hash: 70b4dac1f63291e742a7a88221cc1fd256d719cc0668d819942dda72b8168813
        - id: AT-13
          kind: acceptance_test
          title: Sequencing acceptance
          body: 'Through MCP: link story B to depend on story A while A is still todo (must work), assert start(B) is blocked naming A and its status, drive A to done via the git flow, assert start(B) proceeds; assert linking A back onto B is rejected as a cycle.'
          covers:
            - US-11.AC-1
            - US-11.AC-2
            - US-11.AC-3
            - US-11.AC-4
          approved_content_hash: 6ea1b2ae07d118d300801201121cd07796086123683dc979c3cefded31fc356c
          approved_parent_hash: d2ce943e7a919ba6a17e54327455c31faa2b9fc4396eb59a7c367d64cc9a8c98
    - id: US-12
      kind: story
      title: Spec search
      body: 'As a development agent I need to find the specs that touch my task without reading everything: full-text search over the spec database, plus a complete story-title overview as the product map.'
      status: done
      acceptance_criteria:
        - id: US-12.AC-1
          given: a populated spec database
          when: the agent calls search_specs with a query
          then: nodes matching every query term in title, body or acceptance-criterion text (case-insensitive, tokenized) are returned with id, kind, owning story, title and a matching snippet, ranked by relevance
        - id: US-12.AC-2
          given: a query matching nothing
          when: the agent calls search_specs
          then: the result is an empty list, not an error
        - id: US-12.AC-3
          given: any project state
          when: the agent calls get_overview
          then: every story title and every cross-cutting title is listed — the overview is the complete product map
      approved_content_hash: d83c9cf6c178e9ea93bd3d61aa2b44353e25334f97bb7819871186a0230d23f1
      children:
        - id: AS-12
          kind: arch
          title: FTS-backed search in the engine
          body: 'search runs on the FTS5 index (US-19): tokenized terms with AND semantics, last term as word prefix, BM25 ranking, FTS snippets. AC text is folded into the story''s index row, so criterion matches surface the story. The engine resolves the owning story per hit; the tool surface stays one call.'
          depends_on:
            - target: CC-1
              pinned_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
