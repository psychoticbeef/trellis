          given: exactly one project
          when: the server root is opened
          then: the browser is redirected straight to that project's board
        - id: US-23.AC-4
          given: an already occupied board address
          when: the MCP server starts
          then: it runs without the board and notes the fact on stderr — the agent connection is never blocked
      approved_content_hash: be9d32b4f226aff86fce02ae7ce77c3a2ca7fb8124a99ae528aafe3e1aa3a4ac
      children:
        - id: AS-23
          kind: arch
          title: Multi-project board handler beside stdio
          body: 'internal/board provides a store-backed multi-project handler: `/` lists or redirects, `/p/<id>/` renders that project''s board fresh per request, `/p/<id>/events` streams reload ticks, and live-only extension routes remain scoped below `/p/<id>/`; engines are created per request from the shared store. US-50 adds `/p/<id>/map-position` through public Engine.SetMapPosition. trellis serve starts HTTP in a goroutine before the stdio loop; all board logging goes to stderr because stdout belongs to MCP protocol; bind failure degrades to a notice, never an exit. Relative live URLs keep pages working at any mount point.'
          depends_on:
            - target: CC-1
              pinned_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
