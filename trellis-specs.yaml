    - id: US-19
      kind: story
      title: FTS5 search
      body: 'As a development agent I want spec search to be tokenized and ranked so multi-word queries find the right specs first: all terms must match, the last term matches as a prefix, results order by BM25.'
      status: done
      acceptance_criteria:
        - id: US-19.AC-1
          given: a populated project
          when: search_specs runs with several terms
          then: only specs matching every term are returned, ranked by BM25 relevance, with an FTS-generated snippet highlighting the matches
        - id: US-19.AC-2
          given: a query typed mid-word
          when: the last term is incomplete
          then: it matches as a word prefix, so agents find specs while typing partial identifiers
        - id: US-19.AC-3
          given: any node or acceptance-criterion write
          when: the index is consulted afterwards
          then: the FTS index reflects the change immediately — created, updated and deleted content is always searchable or gone
        - id: US-19.AC-4
          given: a query containing FTS syntax or quotes
          when: search_specs runs
          then: the query is treated as literal terms, never as FTS operators, and cannot error
      approved_content_hash: af59c4593344a19d1612792361611fc9bed03d0b344f6a97d3b9749b462216fc
      children:
        - id: AS-19
          kind: arch
          title: Contentless-delete FTS5 index beside the tables
          body: A single fts5 table indexes one row per node (title, body, AC text folded into the story row). The store maintains it inside every write path and rebuilds it on open when it is empty while nodes exist (migration). Queries are built from whitespace-split terms, each double-quoted, the last suffixed with *; ranking is bm25, snippets come from the FTS snippet function. The engine keeps the same SearchHit surface.
          depends_on:
            - target: CC-1
              pinned_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
