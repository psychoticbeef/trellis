    - id: US-18
      kind: story
      title: Live board
      body: As a human I want the board served over HTTP with automatic browser refresh, so the open tab always shows the current spec state without manual regeneration.
      status: done
      acceptance_criteria:
        - id: US-18.AC-1
          given: a project
          when: the human runs trellis board <project> --serve
          then: an HTTP server renders the board fresh from the engine on every request
        - id: US-18.AC-2
          given: an open board page
          when: the spec database changes (any new event)
          then: the page reloads automatically within about a second via a server-sent-events tick
        - id: US-18.AC-3
          given: the static mode
          when: the human runs trellis board <project> without --serve
          then: the file export works unchanged
      approved_content_hash: 599c95733c6e2a4f234f9211a320d4ee88f01d49537f5dba1cf68e5f2ef31bad
      children:
        - id: AS-18
          kind: arch
          title: Render per request, reload via event-log polling
          body: GET / renders board.Render fresh — no cache, no second data path. GET /events is an SSE stream; the server polls the event log's max sequence once per second and emits a tick when it grows, which the page's EventSource handler answers with location.reload(). Works across processes because the event log lives in the shared store.
          depends_on:
            - target: CC-1
              pinned_hash: 7b3523464c92329a5e1f2b5c6e66de1ffeaecb5f275a566b28d6995e9b23c9d2
