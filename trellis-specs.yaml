    - id: US-18
      kind: story
      title: Live board
      body: As a human I want the board served over HTTP with automatic browser refresh, so the open tab always shows the current spec state without manual regeneration.
      status: done
      paths:
        - internal/board/serve.go
        - internal/board/serve_test.go
      activity: UA-7
      rank: 1
      slice: 3
      acceptance_criteria:
