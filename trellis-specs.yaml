    - id: US-8
      kind: story
      title: Done trees are living context
      body: 'As the process owner I want done spec trees to stay editable so the context source tracks reality: corrections happen in place, honesty comes from stale markers and explicit re-approval, and done stories are never reopened automatically.'
      status: done
      acceptance_criteria:
        - id: US-8.AC-1
          given: a done story
          when: the agent creates, updates or deletes nodes or acceptance criteria in its tree
          then: the operation succeeds and freshness markers flag every unreviewed change
        - id: US-8.AC-2
          given: an edit anywhere in a done tree
          when: automatic downgrade evaluates affected stories
          then: the done story keeps status done — reopening is never automatic
        - id: US-8.AC-3
          given: a stale node in a done tree
          when: it is re-approved with current content and dependency hashes
          then: the stale markers clear
      approved_content_hash: 394b91d71a5b01f57ddcb3e01f6eb22d88f7ed8dda7901dfe71eac7c17575ab1
      children:
        - id: AS-8
          kind: arch
          title: No content locks, ever
          body: 'The engine mutation path carries no done-status guard: structural rules and hash bookkeeping are the only content gates. Done status gates transitions exclusively. downgradeAffected keeps skipping done stories; approval works identically on done trees, which is how stale markers are cleared.'
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
