    - id: US-9
      kind: story
      title: 'Merge gate: test what will merge'
      body: As the process owner I want finish to reject a feature branch that is behind the base branch, so the tests that gate the merge always ran on the exact content that lands in the base.
      status: done
      acceptance_criteria:
        - id: US-9.AC-1
          given: a base branch that advanced since the feature branch was created
          when: the agent runs finish
          then: finish is blocked telling the agent to merge or rebase the base branch into the feature branch first
        - id: US-9.AC-2
          given: a feature branch that contains the base branch tip
          when: the agent runs finish with all gates green
          then: the merge proceeds
      approved_content_hash: dae3b8d51c4ff77340f2d261f67794ba291ed374ef0a7ff663e88030158d1ee2
      children:
        - id: AS-9
