                  body: Unit-test the spec-id extraction (boundaries, US ids excluded from test binding), meta-file exclusion patterns, unclaimed-file computation with nested declared folders, and report envelope serialization.
                  approved_content_hash: 227aa23a7e9af663f46748a4ddbf6c0ac9be444b0d998aa6c5f36b89edf0cabd
                  approved_parent_hash: de3cac5086b4803e5b98376a3a6e4721ec70ffde45c4337eddc6b607b55c8c2f
