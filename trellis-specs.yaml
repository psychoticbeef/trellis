    - id: US-2
      kind: story
      title: Structured acceptance criteria
      body: As a product owner I express acceptance criteria as structured given/when/then triples attached to a story so that coverage is mechanically checkable instead of prose interpretation.
      status: done
      acceptance_criteria:
