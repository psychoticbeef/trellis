    - id: US-20
      kind: story
      title: Gates run where the commit happens
      body: As a development agent I want the pre-commit and pre-push gates to execute in the worktree I am committing from, so the feedback I get reflects my own state, not the main worktree's.
      status: done
      acceptance_criteria:
        - id: US-20.AC-1
          given: a gate invocation from inside a story worktree of the project repo
          when: trellis gate lint or test runs
          then: the configured command executes in that worktree's root, so the verdict reflects the committing worktree
        - id: US-20.AC-2
          given: a gate invocation from a directory outside the project repository
          when: trellis gate lint or test runs
          then: the command falls back to the project's main repo path
      approved_content_hash: 8a2a3fb0e850db6e6ca7dba410ebe72420514112305f05cef08b13417a02b687
      children:
        - id: AS-20
          kind: arch
          title: Gate dir resolution by git context
          body: 'trellis gate resolves its working directory from the caller''s git context: if the current directory lies in a worktree whose common git dir belongs to the project repo, the command runs in that worktree''s toplevel; otherwise it runs in the configured repo path. The branch gate already operates on the caller''s HEAD and stays unchanged.'
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
          approved_content_hash: 4096d77dd9b7c16c495c1f7b226f2f3d063a4177694df9c4414a2c3dad0f45c5
          approved_parent_hash: 8a2a3fb0e850db6e6ca7dba410ebe72420514112305f05cef08b13417a02b687
