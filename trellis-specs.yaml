    - id: US-45
      kind: story
      title: Placement gate
      body: 'Map complete is derived on every call as: at least one activity and no unmapped story. The placement gate is prospective: it evaluates the state before a mutation and rejects every mutation that would turn a complete map incomplete, with an exhaustive error naming the activities and open slices. No import or refine gate: an unmapped story cannot exist while the map is complete.'
      status: done
      paths:
