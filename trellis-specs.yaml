              approved_content_hash: e2b2c8cd8cdfd8dc84b4aab5ad37c0d0fe549317fac7109119fd1d66ca4c2d1a
              approved_parent_hash: 3463a018de83cba1b1de46c7b0ea1fa2f0f025c75cd84c6049e24f53b967f786
