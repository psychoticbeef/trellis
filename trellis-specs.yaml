              body: 'board.MultiHandler(st) routes `/`, `/p/{id}/`, `/p/{id}/events`, and project-scoped live-only extension routes; index template uses board tokens; one project redirects; engines are created per request. US-50 supplies POST `/p/{id}/map-position` with JSON placement input and public Engine.SetMapPosition. cmd serve: --board-addr flag (default 127.0.0.1:7420, off disables), net.Listen plus goroutine before srv.Run, stderr notices. Relative live URLs are shared with single-board server.'
              approved_content_hash: e950f5976744bb9a0b8ef2e01f43f52da7160cd7cc07dfd5afb90dbfd40f72ba
