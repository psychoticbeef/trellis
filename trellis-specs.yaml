          children:
            - id: DD-13
              kind: detail_design
              title: Search delegation to the FTS index
              body: core.Search delegates to store.SearchFTS and resolves each hit's owning story; hits arrive deduplicated (one index row per node) and ranked. Query construction and index maintenance live in the store (see US-19 DD-20).
              approved_content_hash: cdf4529e5b6507f60be19bc872a6581e1d2ca22fd615a9ff5691e6ac93f402ce
              approved_parent_hash: e69b389a06e6e3bdce6ebf17e9f4e54293e5278eceb74391de03ca20120f46a8
              children:
