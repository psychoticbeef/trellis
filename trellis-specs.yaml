                    recorded_at: "2026-08-30T14:00:10Z"
            - id: IT-29
              kind: integration_test
              title: Bootstrap integration
              body: 'Fresh and pre-populated repos through init: wiring commit contents, gitignore create/append/no-op matrix, no-commit cases (nothing new, no git repo), warning emission off-PATH.'
