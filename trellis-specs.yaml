    - id: US-3
      kind: story
      title: Hash-based approval and invalidation
      body: As the process owner I want every spec node explicitly approved against the exact content that was read, and every edit to invalidate dependent approvals, so that nothing enters development on stale understanding.
      status: done
      acceptance_criteria:
        - id: US-3.AC-1
          given: any node
          when: the agent approves it passing the node's current content hash
          then: the approval is recorded together with the parent's current hash
        - id: US-3.AC-2
          given: a node whose content changed since the agent read it
          when: the agent approves with the old hash
          then: approval is rejected and the agent is told to re-read the node; the expected hash is not revealed
        - id: US-3.AC-3
          given: a node whose parent is not approved and fresh
          when: the agent tries to approve the node
          then: approval is rejected demanding top-down approval
        - id: US-3.AC-4
          given: an approved tree
          when: any node in it is edited
          then: the edited node and all its children/dependents become stale with reasons naming old and new short-hashes, and affected refined/in_progress stories drop to todo
      approved_content_hash: d3a2991aacc09bc80ceb50f4d65d4dada6d217294f44fd4ff1900493d88f12f8
      children:
        - id: AS-3
          kind: arch
          title: Hash-pinned approvals with computed freshness
          body: 'Approval stores (approved_content_hash, approved_parent_hash) on the node; dependency edges store a pinned target hash. Freshness is always computed, never cached: a node is fresh iff its own, its parent''s and all pinned hashes match current content. Story downgrades are the only eagerly-written consequence.'
          depends_on:
            - target: CC-2
              pinned_hash: 7a4cb090b53f0549fe37d4a5cb836cb1b309ebce9f0a231212ae7f0f62a46f2d
